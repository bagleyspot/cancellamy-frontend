version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-router', '@types/react', '@types/react-dom']
      testing:
        patterns: ['vitest', '@vitest/*', 'msw', '@testing-library/*', 'jsdom']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*', 'globals']
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades are decided by hand (they often need code changes); known pins: @hookform/resolvers 6 fails to install, plugin-react 6 needs Vite 8.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build(deps)'
    ignore:
      # Stay on the Node.js 22 LTS line; bump it deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
