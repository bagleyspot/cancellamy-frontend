name: Bug report
description: Something does not work as expected in the web app
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste personal data or tokens. Security problems go through a private advisory (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      render: shell
